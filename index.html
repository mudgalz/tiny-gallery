<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tiny.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="YMsGS9X3jtVXminjgiuO3BLvzdK75dKAqtHa3RFZnbc" />
    <title>Tiny Gallery</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Tiny Gallery" />
    <meta name="description" content="Tiny Gallery - A minimalistic gallery to showcase your images." />
    <meta name="author" content="Tiny Gallery" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinygallery.netlify.app/" />
    <meta property="og:title" content="Tiny Gallery" />
    <meta property="og:description" content="Tiny Gallery - A minimalistic gallery to showcase your images." />
    <meta property="og:image" content="https://tinygallery.netlify.app/og_img.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tinygallery.netlify.app/" />
    <meta name="twitter:title" content="Tiny Gallery" />
    <meta name="twitter:description" content="Tiny Gallery - A minimalistic gallery to showcase your images." />
    <meta name="twitter:image" content="https://tinygallery.netlify.app/og_img.png" />

    <!-- Optional: Favicon for Apple devices -->
    <link rel="apple-touch-icon" href="/tiny.svg" />
    
    <!-- Optional: Schema.org for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tiny Gallery",
        "url": "https://tinygallery.netlify.app/",
        "description": "Tiny Gallery - A minimalistic gallery to showcase your images."
      }
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
